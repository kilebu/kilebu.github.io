<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Senior Full-Stack and AI Engineer with 7+ years. TypeScript, React, Node.js, LangGraph.js, Anthropic Claude API. Nairobi, Kenya. Remote-ready." />
  <title>Caleb Wafula - Senior Full-Stack and AI Engineer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #7c6dfa;
      --accent-dim: rgba(124,109,250,0.12);
      --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
      --font-sans: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      height: 56px;
    }
    .nav-logo {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text);
      letter-spacing: 0.04em;
    }
    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    .nav-badge {
      font-size: 0.7rem;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 2px 10px;
      letter-spacing: 0.05em;
    }

    /* HERO */
    .hero {
      max-width: 900px;
      margin: 0 auto;
      padding: 7rem 2rem 5rem;
    }
    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }
    .hero-sub {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 560px;
      margin-bottom: 2.5rem;
    }
    .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 3.5rem; }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { border: 1px solid var(--border); color: var(--text); }

    .hero-meta {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .hero-meta span { display: flex; align-items: center; gap: 0.4rem; }

    /* STATS */
    .stats {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      max-width: 900px;
      margin: 0 auto;
    }
    .stat {
      padding: 2rem 1.5rem;
      border-right: 1px solid var(--border);
      text-align: center;
    }
    .stat:last-child { border-right: none; }
    .stat-num {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      display: block;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
    }

    /* SECTIONS */
    section {
      max-width: 900px;
      margin: 0 auto;
      padding: 5rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      letter-spacing: -0.01em;
    }

    /* SKILLS */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .skill-group h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* EXPERIENCE */
    .exp-list { display: flex; flex-direction: column; gap: 2.5rem; }
    .exp-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 1.5rem;
    }
    .exp-date {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      padding-top: 0.2rem;
      line-height: 1.5;
    }
    .exp-role {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }
    .exp-company {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .exp-body { color: var(--muted); font-size: 0.88rem; }
    .exp-body ul { padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.3rem; }

    /* PROJECTS */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
      gap: 1.25rem;
    }
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      transition: border-color 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .project-card:hover { border-color: var(--accent); }
    .project-num {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    .project-name {
      font-size: 1rem;
      font-weight: 600;
    }
    .project-desc {
      font-size: 0.85rem;
      color: var(--muted);
      flex: 1;
    }
    .project-stack { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.25rem; }
    .project-stack .tag { font-size: 0.7rem; }
    .project-links { display: flex; gap: 0.75rem; margin-top: 0.25rem; }
    .project-links a {
      font-size: 0.75rem;
      color: var(--accent);
      font-family: var(--font-mono);
    }

    /* CREDENTIALS */
    .cred-list { display: flex; flex-direction: column; gap: 1.25rem; }
    .cred-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .cred-item:last-child { border-bottom: none; }
    .cred-title { font-weight: 600; font-size: 0.95rem; }
    .cred-org { font-size: 0.82rem; color: var(--muted); margin-top: 0.2rem; }
    .cred-date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; margin-left: 1rem; }

    /* CONTACT */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }
    .contact-card-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.35rem; }
    .contact-card-value { font-size: 0.95rem; color: var(--text); }
    .contact-card-value a { color: var(--text); }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 2.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .stat:nth-child(3) { border-right: none; }
      .stat:nth-child(4) { border-top: 1px solid var(--border); }
      .exp-item { grid-template-columns: 1fr; gap: 0.5rem; }
      .projects-grid { grid-template-columns: 1fr; }
